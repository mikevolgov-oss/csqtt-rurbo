name: Build Marusya voice router

on:
  workflow_dispatch:
  push:
    branches:
      - marusya-voice-router
    paths:
      - ".github/workflows/marusya-voice-router.yml"
      - "marusya-voice-router/**"

permissions:
  contents: read

jobs:
  build-upstream-module:
    name: Build and test ChatGPT Audio Route module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project notes and workflow
        uses: actions/checkout@v4

      - name: Checkout pinned upstream module source
        uses: actions/checkout@v4
        with:
          repository: peiyingyao/io.github.peiyingyao.chatgptvoiceroute
          ref: 6363e791ded3889b9b27b1fe6ed6057086778cad
          path: upstream

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager not found under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.1.0"

      - name: Run JVM tests
        working-directory: upstream/module
        run: gradle test --no-daemon

      - name: Build debug module APK
        working-directory: upstream/module
        run: gradle :xposed:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: marusya-voice-router-debug
          path: upstream/module/xposed/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
